services:
  users:
    build:
      context: ./users
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  orders:
    build:
      context: ./orders
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - USERS_SERVICE=http://users:8000
      - ORDERS_SERVICE=http://orders:8000
      - GATEWAY_TOKEN=${GATEWAY_TOKEN}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      users:
        condition: service_healthy
      orders:
        condition: service_healthy
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

networks:
  backend_net:
    driver: bridge

apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-html
  namespace: demo
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Catalog Service</title></head>
    <body>
      <h1>Catalog Service API</h1>
      <p>Bienvenue sur le service catalogue E-Shop !</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-demo
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-demo
  template:
    metadata:
      labels:
        app: catalog-demo
    spec:
      containers:
      - name: catalog
        image: nginx:1.27
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: catalog-html
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: catalog-demo
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
